# Local production-style deployment of the finance app.
#
# Requirements:
#   - Docker + Docker Compose
#   - A populated ./.env file (see .env.example). The app's DB is external
#     (Neon), so no database service is defined here.
#
# Usage:
#   docker compose up --build -d        # build image + start on :3000
#   docker compose down                 # stop and remove container
#
# DB migrations are NOT run here (the image is a standalone Next.js build).
# Apply them from the host against your DATABASE_URL instead:
#   bun run db:migrate

services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        # Public/embedded into the client bundle at build time (optional here);
        # the value is also injected again at runtime below.
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    image: finance-web
    container_name: finance-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NODE_ENV: production
      # Secrets + runtime env (source: ./.env)
      DATABASE_URL: ${DATABASE_URL}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}